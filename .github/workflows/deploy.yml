name: Deploy to Locaweb via FTP

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Locaweb FTP
        env:
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          set -e
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASSWORD" ]; then
            echo "FTP credentials are not configured"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y lftp

          lftp -e "set ssl:verify-certificate no; mirror -R dist/ public_html/; quit" -u "$USER","$PASSWORD" "$HOST"
